[project]
name = "jev-model-router"
version = "0.1.0"
description = "Per-turn Jev model routing proxy for Codex App Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typesafe-sdk>=0.7,<1", "websockets>=14,<17"]

[project.scripts]
jev-model-router = "jev_model_router.proxy:main"
jev-codex = "jev_model_router.launcher:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_model_router"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
