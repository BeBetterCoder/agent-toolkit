[project]
name = "jev-decision-mcp"
version = "0.3.0"
description = "A confidence-gated Jev decision tool for Codex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=2,<3",
  "pydantic>=2,<3",
  "typesafe-sdk",
]

[project.scripts]
jev-decision-mcp = "jev_decision_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-anyio>=0.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_decision_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
